name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - run: python -m pip install 'coverage>=7,<8'
      - run: python -m coverage run --branch --source=job_bot,employer_degree -m unittest -v
      - run: python -m coverage report --fail-under=80
