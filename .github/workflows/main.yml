name: ACM Job Radar

on:
  schedule:
    # Every 30 minutes. Do NOT lower this to */15 - GitHub deprioritises
    # high-frequency schedules on public repos and silently drops most of
    # them. A */15 schedule was actually landing ~6 runs/day; */30 is honoured
    # far more consistently and the bot only needs a couple of runs a day to
    # keep up with ~100 new listings.
    - cron: "*/30 * * * *"
  workflow_dispatch: # manual "Run workflow" button in the Actions tab
    inputs:
      backfill_days:
        description: "Backfill N days of open jobs (a number, or 'all'). Blank = normal run."
        required: false
        default: ""
      backfill_since:
        description: "Backfill from an exact date, YYYY-MM-DD (overrides the days box)."
        required: false
        default: ""
      only_channels:
        description: "Post to these channels only, e.g. 'grad'. Blank = all. Use when backfilling a new channel."
        required: false
        default: ""
      dry_run:
        description: "Dry run: print what would be posted, send nothing to Discord."
        type: boolean
        required: false
        default: false

# Never let two runs overlap (prevents duplicate posts / git push races)
concurrency:
  group: job-radar
  cancel-in-progress: false

permissions:
  contents: write # needed to commit seen_jobs.json back to the repo

jobs:
  post-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # a full backfill takes ~10 min; this is just a guard
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Run job bot
        env:
          DISCORD_WEBHOOK_INTERNSHIPS: ${{ secrets.DISCORD_WEBHOOK_INTERNSHIPS }}
          DISCORD_WEBHOOK_NEWGRAD: ${{ secrets.DISCORD_WEBHOOK_NEWGRAD }}
          DISCORD_WEBHOOK_GRAD: ${{ secrets.DISCORD_WEBHOOK_GRAD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }} # lets repo auto-discovery avoid rate limits

          BACKFILL_DAYS: ${{ inputs.backfill_days }}
          BACKFILL_SINCE: ${{ inputs.backfill_since }}
          ONLY_CHANNELS: ${{ inputs.only_channels }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

          # --- What gets posted -------------------------------------------
          # CS/IT roles only. Add "Hardware" for computer-engineering roles
          # or "Quant" for quantitative finance. Full vocabulary:
          #   Software | AI/ML/Data | Hardware | Product | Quant
          CATEGORY_ALLOWLIST: "Software,AI/ML/Data,Product"
          US_ONLY: "1" # drop London / Toronto / Bangalore postings
          DROP_EXPIRED_TERMS: "1" # no "Summer 2026" listings in September 2026
          # No degree filter: PhD and Master's roles are posted too.

          # --- Pacing ------------------------------------------------------
          # Inflow is ~100 relevant listings/day. A 40/run cap over even a
          # handful of runs leaves ~2x headroom, and MAX_JOB_AGE_DAYS makes
          # sure a missed day can never turn into a stale backlog.
          MAX_POSTS_PER_RUN: "40"
          MAX_JOB_AGE_DAYS: "7"

          # --- Degree routing ----------------------------------------------
          # Three channels: bachelors / grad / newgrad. "grad" means an MS or
          # PhD is REQUIRED, not merely accepted - ~1,000 roles take either,
          # and those stay in the bachelors/newgrad channels rather than being
          # posted twice. When the feed omits the degree we read the posting
          # itself from Greenhouse/Ashby/Lever (free, keyless) and abstain if
          # it does not clearly say. Set DEGREE_LOOKUP=0 to turn that off.
          DEGREE_LOOKUP: "1"
          MAX_DEGREE_LOOKUPS: "40" # per-run HTTP budget

          # --- Presentation ------------------------------------------------
          LOCAL_STATES: "NJ,NY,PA,CT,DE" # these get a marker + posting priority
          TIMEZONE: "America/New_York"
          DATE_HEADERS: "1"

          # Silent delivery: members never get a push notification. Leave this
          # at 1 and leave PING_ROLE_ID unset unless you first create an
          # opt-in, self-assignable role - otherwise this pings ~100x/day.
          SILENT: "1"
          PING_ROLE_ID: ${{ vars.PING_ROLE_ID }}
        run: python3 job_bot.py

      - name: Save seen-jobs state
        if: always() # state is written even if posting failed partway
        run: |
          git config user.name "acm-job-radar[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json || true
          git add degree_cache.json || true
          if git diff --cached --quiet; then
            echo "No new jobs this run - nothing to commit."
            exit 0
          fi
          git commit -m "update seen jobs"
          # Retry the push: a queued manual run can land between our fetch and
          # push even with the concurrency group.
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "pushed"
              exit 0
            fi
            echo "push attempt $i failed, retrying..."
            sleep 5
          done
          echo "::error::could not push seen_jobs.json after 3 attempts"
          exit 1
